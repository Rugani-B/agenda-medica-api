<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso — Agenda Médica</title>
  <style>
    body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;
         height:100vh;margin:0;background:#f0f4f8}
    form{background:white;padding:2rem;border-radius:8px;
         box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:300px}
    h2{margin:0 0 .5rem;color:#1a5276}
    p.sub{color:#666;font-size:.85rem;margin:0 0 1.5rem}
    p.erro{color:#c0392b;margin:0 0 1rem}
    label{font-size:.85rem;color:#444;display:block;margin-bottom:2px}
    input[type=password]{width:100%;padding:.6rem;margin-bottom:1rem;box-sizing:border-box;
         border:1px solid #ccc;border-radius:4px;font-size:.95rem}
    button{width:100%;padding:.7rem;background:#1a5276;color:white;border:none;
         border-radius:4px;cursor:pointer;font-size:1rem}
    button:hover{background:#1f618d}
  </style>
</head>
<body>
  <form method="post" action="/familia/acesso">
    <h2>Agenda Médica</h2>
    <p class="sub">Digite a senha deste link para abrir a agenda</p>
    {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
    <input type="hidden" name="responsavel_id" value="{{ responsavel_id }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>Senha</label>
    <input type="password" name="senha" required autofocus autocomplete="current-password">
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
