<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — {{ paciente.nome }}</title>
  <link rel="stylesheet" href="/static/style.css?v={{ cache_bust }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body          { height: auto !important; overflow: auto !important; }
    .v2-wrapper   { max-width: 1400px; margin: 0 auto; padding: 0 1rem 2rem; }
    .v2-toolbar   { display: flex; align-items: center; flex-wrap: wrap; gap: 1rem;
                    padding: .75rem 0 1rem; border-bottom: 1px solid #e0e0e0; margin-bottom: 1.2rem; }
    .v2-toolbar .relatorio-bar { flex: 1; min-width: 280px; margin: 0; }
    .v2-toolbar .modo-btn-unico { white-space: nowrap; }
    .anual-bloco  { margin-bottom: 2rem; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <span class="titulo">🏥 <span class="titulo-prefixo">Agenda de</span> {{ paciente.nome }}</span>
    <span class="subtitulo">Olá, {{ responsavel.nome }}</span>
    <nav style="display:flex;gap:1rem;align-items:center">
      <a href="/familia/" style="color:white;font-size:.82rem;opacity:.8;text-decoration:none">Vista anterior</a>
      <a href="/familia/meus-acessos" style="color:white;font-size:.82rem;opacity:.8;text-decoration:none">🔒 Meus acessos</a>
      <a href="/familia/logout" style="color:white;font-size:.82rem;opacity:.8;text-decoration:none">Sair →</a>
    </nav>
  </div>
</header>

<div class="v2-wrapper">

  <!-- Barra de ferramentas: Relatório + toggle -->
  <div class="v2-toolbar">
    <div class="relatorio-bar">
      <span class="relatorio-titulo">📄 Relatório PDF</span>
      <form class="relatorio-form" id="formRelatorio"
            action="/familia/relatorio" method="get" target="_blank">
        <input type="hidden" name="responsavel_id" value="{{ responsavel.id }}">
        <label class="relatorio-label">De
          <input type="date" name="inicio" id="relInicio" class="relatorio-input">
        </label>
        <label class="relatorio-label">Até
          <input type="date" name="fim" id="relFim" class="relatorio-input">
        </label>
        <button type="submit" class="relatorio-btn">⬇ Baixar</button>
      </form>
    </div>
    <button class="modo-btn-unico" id="btn-modo-global" onclick="toggleModoGlobal()">📅 Calendário</button>
  </div>

  <!-- Calendário anual: Consultas -->
  <div class="anual-bloco">
    <h3 class="anual-titulo anual-titulo-consulta">🏥 Consultas — {{ ano }}</h3>
    <div id="view-cal-c" style="display:none">
      <div class="anual-scroll" id="scroll-consultas">
        <table class="anual-table" id="table-consultas"></table>
      </div>
    </div>
    <div id="view-lst-c">
      <div class="lista-view" id="lista-consultas"></div>
    </div>
  </div>

  <!-- Calendário anual: Exames -->
  <div class="anual-bloco">
    <h3 class="anual-titulo anual-titulo-exame">🔬 Exames — {{ ano }}</h3>
    <div id="view-cal-e" style="display:none">
      <div class="anual-scroll" id="scroll-exames">
        <table class="anual-table" id="table-exames"></table>
      </div>
    </div>
    <div id="view-lst-e">
      <div class="lista-view" id="lista-exames"></div>
    </div>
  </div>

  <!-- Calendário anual: Tratamentos -->
  <div class="anual-bloco">
    <h3 class="anual-titulo anual-titulo-trat">💊 Tratamentos — {{ ano }}</h3>
    <div id="view-cal-t" style="display:none">
      <div class="anual-scroll" id="scroll-tratamentos">
        <table class="anual-table" id="table-tratamentos"></table>
      </div>
      <div class="trat-detalhe" id="trat-detalhe" style="display:none"></div>
    </div>
    <div id="view-lst-t">
      <div class="lista-view lista-view-trat" id="lista-tratamentos"></div>
    </div>
  </div>

</div>

<!-- Modal semana -->
<div class="modal-overlay" id="modal-overlay" onclick="fecharModal()" style="display:none"></div>
<div class="modal-box" id="modal-box" style="display:none"></div>

<script>
const EVENTOS = {{ eventos_json|safe }};
const ANUAL   = {{ anual_json|safe }};
const TOKEN   = "";
const HOJE    = "{{ hoje }}";

function statusCor(s) {
  return {agendada:"#2c7be5",confirmada:"#27ae60",realizada:"#27ae60",
    cancelada:"#e74c3c",reagendada:"#e67e22",agendado:"#2c7be5",
    realizado:"#27ae60",cancelado:"#e74c3c",a_marcar:"#aaa"}[s] || "#aaa";
}

function segundaFeira(d) {
  const [a, m, dia] = d.split("-").map(Number);
  const dt = new Date(a, m - 1, dia);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  dt.setDate(dt.getDate() + diff);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}
const SEG_ATUAL = segundaFeira(HOJE);

// ── Calendários anuais ──
function buildAnual(tableId, data, classe, comModal=false) {
  const {meses, max_semanas} = data;
  const table = document.getElementById(tableId);

  const thead = document.createElement("thead");
  const trMes = document.createElement("tr");
  meses.forEach(m => {
    const th = document.createElement("th");
    th.className = "anual-mes-header " + classe;
    th.textContent = m.nome;
    trMes.appendChild(th);
  });
  thead.appendChild(trMes);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (let row = 0; row < max_semanas; row++) {
    const tr = document.createElement("tr");
    meses.forEach(m => {
      const td = document.createElement("td");
      const s = m.semanas[row];
      if (s) {
        const isCurrent = s.seg === SEG_ATUAL;
        td.className = "anual-cell "
          + (s.conteudo.length ? "anual-cell-ativo " + classe : "")
          + (isCurrent ? " anual-sem-atual" : "");
        td.dataset.seg = s.seg;
        td.title = s.conteudo.join("\n") || "";
        td.innerHTML =
          `<div class="anual-cell-hdr"><strong>Sem. ${s.label_num}</strong> ${s.label_data}</div>` +
          s.conteudo.map(c =>
            `<div class="anual-item">▸ ${c.length > 18 ? c.slice(0,17)+"…" : c}</div>`
          ).join("");
        if (comModal && s.conteudo.length) {
          td.style.cursor = "pointer";
          td.addEventListener("click", () => comModal(s.seg));
        }
      } else {
        td.className = "anual-cell anual-cell-empty";
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
}

function buildAnualTrat(tableId, data) {
  const {meses, max_semanas} = data;
  const table = document.getElementById(tableId);

  const thead = document.createElement("thead");
  const trMes = document.createElement("tr");
  meses.forEach(m => {
    const th = document.createElement("th");
    th.className = "anual-mes-header cls-t";
    th.textContent = m.nome;
    trMes.appendChild(th);
  });
  thead.appendChild(trMes);
  table.appendChild(thead);

  const tbody = document.createElement("tbody");
  for (let row = 0; row < max_semanas; row++) {
    const tr = document.createElement("tr");
    meses.forEach(m => {
      const td = document.createElement("td");
      const s = m.semanas[row];
      if (s) {
        const c = s.conteudo;
        const temDados = c.prescricoes && c.prescricoes.length > 0;
        const isCurrent = s.seg === SEG_ATUAL;
        const semRegistro = temDados && c.prescricoes.every(p => !p.nivel);

        td.className = "anual-cell "
          + (temDados ? "anual-cell-ativo cls-t" : "")
          + (isCurrent ? " anual-sem-atual" : "")
          + (semRegistro ? " trat-sem-registro" : "");
        td.dataset.seg = s.seg;
        td.dataset.trat = JSON.stringify(s);

        let html = `<div class="anual-cell-hdr"><strong>Sem. ${s.label_num}</strong> ${s.label_data}</div>`;

        if (temDados) {
          html += `<div class="trat-nmeds">${c.n_meds} medicamento${c.n_meds !== 1 ? 's' : ''}</div>`;
          const comNivel = c.prescricoes.filter(p => p.nivel);
          if (comNivel.length > 0) {
            const pctMedio = Math.round(comNivel.reduce((s,p) => s + p.pct, 0) / comNivel.length);
            const cor = comNivel[comNivel.length-1].cor;
            html += `<div class="trat-barra-outer"><div class="trat-barra-inner" style="width:${pctMedio}%;background:${cor}"></div></div>
                     <div class="trat-nivel-label" style="color:${cor}">Adesão ${pctMedio}%</div>`;
          } else {
            html += `<div class="trat-barra-outer"><div class="trat-barra-inner" style="width:0%"></div></div>
                     <div class="trat-nivel-label" style="color:#ccc">não registrado</div>`;
          }
        }

        td.innerHTML = html;
        if (temDados) {
          td.style.cursor = "pointer";
          td.style.color = "#5a2d00";
          td.addEventListener("click", () => abrirDetalheTrat(s, td));
        }
      } else {
        td.className = "anual-cell anual-cell-empty";
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
}

function abrirDetalheTrat(s, tdClicado) {
  document.querySelectorAll(".anual-cell").forEach(e => e.classList.remove("trat-selecionado"));
  tdClicado.classList.add("trat-selecionado");

  const painel = document.getElementById("trat-detalhe");
  const c = s.conteudo;
  if (!c.prescricoes || !c.prescricoes.length) { painel.style.display = "none"; return; }

  let html = `<div class="trat-det-titulo">Semana ${s.label_num} — ${s.label_data}
    <button onclick="document.getElementById('trat-detalhe').style.display='none'" class="trat-det-fechar">✕</button>
  </div>`;

  c.prescricoes.filter(p => p.medicamentos && p.medicamentos.length > 0).forEach(p => {
    const nivelLabel = p.nivel ? `Adesão ${p.pct}%` : "não registrado";
    const cor = p.cor || "#ccc";
    const pct = p.pct || 0;
    html += `<div class="trat-det-presc">
      <div class="trat-det-meds">${p.medicamentos.map(m => `<span>💊 ${m}</span>`).join("")}</div>
      <div class="trat-det-row">
        <span class="trat-nivel-label" style="color:${cor}">▸ ${nivelLabel}</span>
        <form method="post" action="/familia/adesao/${p.id}/registrar" class="trat-det-form">
          <input type="hidden" name="semana_override" value="${s.seg}">
          <select name="nivel" class="trat-select">
            ${["nenhuma","baixa","parcial","boa","total"].map(n =>
              `<option value="${n}" ${n === p.nivel ? 'selected' : ''}>${n}</option>`
            ).join("")}
          </select>
          <button type="submit" class="btn-acao">Salvar</button>
        </form>
      </div>
    </div>`;
  });

  painel.innerHTML = html;
  painel.style.display = "block";
  setTimeout(() => painel.scrollIntoView({ behavior: "smooth", block: "nearest" }), 50);
}

// ── Listas ──
const LISTA_C = ANUAL.lista_consultas || [];
const LISTA_E = ANUAL.lista_exames    || [];

function buildLista(containerId, itens, tipo) {
  const el = document.getElementById(containerId);
  if (!itens.length) { el.innerHTML = '<p class="lista-vazia">Nenhum registro encontrado.</p>'; return; }
  el.innerHTML = itens.map(item => {
    const cor = statusCor(item.status);
    if (tipo === 'c') {
      return `<div class="lista-item lista-item-c" onclick="abrirModal('/familia/consulta/${item.id}/detalhe')">
        <span class="lista-data">${item.data}</span>
        <span class="lista-status" style="color:${cor}">${item.status}</span>
        <span class="lista-nome">${item.especialidade || item.medico || 'Consulta'}</span>
        <span class="lista-medico">${item.medico && item.especialidade ? 'Dr(a). '+item.medico : ''}</span>
      </div>`;
    } else {
      return `<div class="lista-item lista-item-e" onclick="abrirModal('/familia/semana-exames/${item.seg}')">
        <span class="lista-data">${item.data}</span>
        <span class="lista-status" style="color:${cor}">${item.status}</span>
        <span class="lista-nome">${item.tipo}</span>
        <span class="lista-medico">${item.local || ''}</span>
      </div>`;
    }
  }).join('');
}

buildLista('lista-consultas', LISTA_C, 'c');
buildLista('lista-exames',    LISTA_E, 'e');

// ── Lista de tratamentos ──
const LISTA_T = ANUAL.lista_tratamentos || [];
(function buildListaTrat() {
  const el = document.getElementById('lista-tratamentos');
  if (!LISTA_T.length) { el.innerHTML = '<p class="lista-vazia">Nenhuma prescrição encontrada.</p>'; return; }
  el.innerHTML = LISTA_T.map(p => {
    const tagAtiva = p.status_trat === 'ativa'
      ? `<span class="trat-tag trat-tag-ativa">ativa</span>`
      : p.status_trat === 'futura'
      ? `<span class="trat-tag trat-tag-fut">a iniciar</span>`
      : `<span class="trat-tag trat-tag-enc">encerrada</span>`;
    const meds = p.medicamentos.map(m => `<div class="lst-trat-med">💊 ${m}</div>`).join('');

    let adesaoHtml;
    if (!p.ativa) {
      adesaoHtml = '';
    } else if (p.adesao_atual) {
      const barra = `<div class="trat-barra-outer" style="width:80px;display:inline-block;vertical-align:middle">
        <div class="trat-barra-inner" style="width:${p.adesao_pct}%;background:${p.adesao_cor}"></div></div>
        <span class="trat-nivel-label" style="color:${p.adesao_cor};filter:none">Adesão ${p.adesao_pct}%</span>`;
      adesaoHtml = `<div class="lst-trat-adesao">
        ${barra}
        <form method="post" action="/familia/adesao/${p.id}/registrar" class="trat-det-form">
          <input type="hidden" name="semana_override" value="${p.seg_atual}">
          <select name="nivel" class="trat-select">
            ${["nenhuma","baixa","parcial","boa","total"].map(n =>
              `<option value="${n}" ${n===p.adesao_atual?'selected':''}>${n}</option>`
            ).join('')}
          </select>
          <button type="submit" class="btn-acao btn-acao-sm">Salvar</button>
        </form>
      </div>`;
    } else {
      adesaoHtml = `<div class="lst-trat-adesao lst-trat-pend">
        <span>⚠ Semana atual sem registro</span>
        <form method="post" action="/familia/adesao/${p.id}/registrar" class="trat-det-form">
          <input type="hidden" name="semana_override" value="${p.seg_atual}">
          <select name="nivel" class="trat-select">
            ${["nenhuma","baixa","parcial","boa","total"].map(n =>
              `<option value="${n}">${n}</option>`
            ).join('')}
          </select>
          <button type="submit" class="btn-acao btn-acao-sm">Salvar</button>
        </form>
      </div>`;
    }

    const canvasId = `graf-trat-${p.id}`;
    const grafHtml = p.historico && p.historico.length
      ? `<div class="lst-trat-graf"><canvas id="${canvasId}" height="80"></canvas></div>`
      : '';

    return `<div class="lst-trat-card">
      <div class="lst-trat-header">
        <span class="lst-trat-medico">${p.medico ? 'Dr(a). '+p.medico : 'Médico n/i'}</span>
        ${tagAtiva}
        <span class="lst-trat-periodo">${p.periodo}</span>
      </div>
      <div class="lst-trat-meds">${meds}</div>
      ${grafHtml}
      ${adesaoHtml}
    </div>`;
  }).join('');
})();

LISTA_T.forEach(p => {
  if (!p.historico || !p.historico.length) return;
  const canvas = document.getElementById(`graf-trat-${p.id}`);
  if (!canvas) return;
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: p.historico.map(h => h.seg.slice(5).replace('-', '/')),
      datasets: [{
        data: p.historico.map(h => h.pct),
        backgroundColor: p.historico.map(h => h.cor),
        borderRadius: 3,
        borderSkipped: false,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => `Adesão: ${ctx.parsed.y}%` }
      }},
      scales: {
        y: { min: 0, max: 100, ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { color: '#f0f0f0' } },
        x: { ticks: { font: { size: 9 }, maxRotation: 45 }, grid: { display: false } }
      }
    }
  });
});

function toggleModoGlobal() {
  const btn = document.getElementById('btn-modo-global');
  const emLista = document.getElementById('view-lst-c').style.display !== 'none';
  ['c','e','t'].forEach(b => {
    document.getElementById(`view-cal-${b}`).style.display = emLista ? '' : 'none';
    document.getElementById(`view-lst-${b}`).style.display = emLista ? 'none' : '';
  });
  btn.textContent = emLista ? '📋 Lista' : '📅 Calendário';
}

buildAnual("table-consultas", ANUAL.consultas, "cls-c", seg => abrirModal(`/familia/semana/${seg}`));
buildAnual("table-exames",    ANUAL.exames,    "cls-e", seg => abrirModal(`/familia/semana-exames/${seg}`));
buildAnualTrat("table-tratamentos", ANUAL.tratamentos);

function abrirModal(url) {
  const overlay = document.getElementById("modal-overlay");
  const box = document.getElementById("modal-box");
  box.innerHTML = '<div class="modal-loading">Carregando...</div>';
  overlay.style.display = "block";
  box.style.display = "block";
  fetch(url)
    .then(r => r.arrayBuffer())
    .then(buf => { box.innerHTML = new TextDecoder("utf-8").decode(buf); })
    .catch(() => { box.innerHTML = '<div class="modal-loading">Erro ao carregar.</div>'; });
}

function fecharModal() {
  document.getElementById("modal-overlay").style.display = "none";
  document.getElementById("modal-box").style.display = "none";
}

function centralizarSemanaAtual(scrollId) {
  const container = document.getElementById(scrollId);
  const cel = container.querySelector(`[data-seg="${SEG_ATUAL}"]`);
  if (!cel) return;
  const containerWidth = container.clientWidth;
  const celLeft = cel.offsetLeft;
  const celWidth = cel.offsetWidth;
  container.scrollLeft = celLeft - containerWidth / 2 + celWidth / 2;
}

["scroll-consultas","scroll-exames","scroll-tratamentos"].forEach(id => {
  document.getElementById(id).addEventListener("dblclick", () => centralizarSemanaAtual(id));
});
["scroll-consultas","scroll-exames","scroll-tratamentos"].forEach(id => {
  centralizarSemanaAtual(id);
});

(function() {
  const hoje = new Date();
  const ini  = new Date(hoje); ini.setDate(ini.getDate() - 90);
  const fmt  = d => d.toISOString().slice(0, 10);
  document.getElementById('relInicio').value = fmt(ini);
  document.getElementById('relFim').value    = fmt(hoje);
})();
</script>
</body>
</html>
