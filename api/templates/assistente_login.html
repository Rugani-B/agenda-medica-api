<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assistente — Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f4f8;min-height:100vh;
     display:flex;align-items:center;justify-content:center}
.card{background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.10);
      padding:2.5rem 2rem;width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:1.75rem}
.logo h1{font-size:1.25rem;color:#1a5276;font-weight:700}
.logo p{font-size:.85rem;color:#7f8c8d;margin-top:.25rem}
label{display:block;font-size:.85rem;font-weight:600;color:#444;margin-bottom:.3rem}
input{width:100%;padding:.6rem .8rem;border:1px solid #ccc;border-radius:6px;
      font-size:.95rem;margin-bottom:1rem;font-family:inherit}
input:focus{outline:none;border-color:#1a5276;box-shadow:0 0 0 2px rgba(26,82,118,.15)}
.btn{width:100%;padding:.7rem;background:#1a5276;color:white;border:none;
     border-radius:6px;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover{background:#154360}
.erro{background:#fdecea;border:1px solid #e74c3c;border-radius:6px;
      padding:.6rem .9rem;color:#c0392b;font-size:.85rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>🏥 Portal do Assistente</h1>
    <p>Gestão de Agenda Médica</p>
  </div>
  {% if erro %}
  <div class="erro">{{ erro }}</div>
  {% endif %}
  <form method="post" action="/assistente/login">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email" autofocus required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
